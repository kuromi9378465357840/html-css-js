<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8"
        <meta name = "viewport" content="width= device-width, initial-scale=1.0">
        <title> TABLE FORMATION </title>
    </head>
<body>
    <!-- first implement row by row.-->
     <table border="7"> <!-- border increases the width.-->
        <tr> <!-- tr tag is used to create rows. th is table heading-->
            <th>NAME</th>
            <th>SUBJECT</th>
            <th>MARKS</th>
        </tr>

        <tr>
            <td>xyz</td> <!-- td is table data.-->
            <td>Maths</td>
            <td>95</td>
        </tr>

        <tr>
            <td>pqr</td>
            <td>Physics</td>
            <td>91</td>
        </tr>

        <tr>
            <td>mno</td>
            <td>Chemistry</td>
            <td>97</td>
        </tr>

     </table>
<!-- shortcut for comment ctrl+/ -->
<!-- shortcut for table table>thead>tr>th*3^^tbody>tr*4>td*3 -->
<br>
<table border="7">
    <tr>
         <th colspan="3"> STUDENT DETAILS</th> 
         <!-- colspan is used to consume columns. -->
    </tr>

    <tr>
        <th>Name</th>
        <th>Subject</th>
        <th>Marks</th>
    </tr>

    <tr>
        <td rowspan="4"> Aryan</td>
    </tr>
<!-- rowspan is used to consume rows. -->
    <tr>
        <td>HTML</td>
        <td>90</td>
    </tr>

    <tr>
        <td>CSS</td>
        <td>100</td>
    </tr>

    <tr>
        <td>JavaScript</td>
        <td>99</td>
    </tr>

    <tr>
        <td>Rahul</td>
        <td colspan="2"> HTML - 95</td>
        
    </tr>
</table>

<br>
</body>
