<!--CSS positioning -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
    <title>CSS Fifth</title>
    <style>
    p{
        width: 200px;
        padding: 20px;
        margin: 10px;
    }
    box1 {
        border: 1px solid red;
        background-color: burlywood;
    }
    box2 {
        border: 3px solid palevioletred;
        background-color: pink;
        position: relative;
        left: 150 px;
        bottom: 50 px;
    }
    box3 {
        border: 3px solid olive;
        background-color: darkolivegreen;
        position: relative;
        left: 150 px;
        bottom: 12px;
    }
    </style>
    </head>
    <body>
        <box1>HI</box1>
        <br><br>
        <box2>bye</box2>
        <box3>HELLO</box3>
    </body>
</html>
