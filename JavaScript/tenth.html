<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swap2</title>
</head>
<body>
    <script>
        let x = 299;
        let y = 367890;
        x = x + y;
        y = x-y;
        x = x-y;

        document.write("After swapping: x = " + x + ", y = " + y);
    
    </script>
</body>
</html>
