<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up Form</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            max-width: 440px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .step-info {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #333;
            text-transform: uppercase;
        }
        h2 {
            font-size: 26px;
            margin: 8px 0 16px 0;
            font-weight: 700;
        }
        .subtext {
            font-size: 16px;
            line-height: 1.4;
            margin-bottom: 24px;
            color: #333;
        }
        h3 {
            font-size: 18px;
            margin-bottom: 16px;
        }
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        .input-group label {
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 12px;
            color: #737373;
        }
        .input-group input {
            width: 100%;
            padding: 24px 12px 8px 12px;
            box-sizing: border-box;
            border: 1px solid #8c8c8c;
            border-radius: 2px;
            font-size: 16px;
            outline: none;
        }
        .input-group input.valid {
            border-color: #2b7837;
        }
        .input-group input.invalid {
            border-color: #b92d2b;
        }
        .error-message {
            color: #b92d2b;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin: 20px 0 24px 0;
            font-size: 15px;
        }
        .checkbox-group input {
            width: 24px;
            height: 24px;
            margin-right: 12px;
        }
        .btn-submit {
            width: 100%;
            background-color: #e50914;
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-radius: 2px;
        }
        .btn-submit:hover {
            background-color: #f40612;
        }
    </style>
</head>
<body>

    <div class="step-info">Step 2 of 3</div>
    <h2>Sign up to start your free month.</h2>
    <div class="subtext">
        Just two more steps and you're finished!<br>
        We hate paperwork, too.
    </div>

    <h3>Create your account.</h3>

    <form id="signupForm">
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="valid" value="alex@conversionxl.com">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="invalid" value="123">
            <div class="error-message" id="passwordError" style="display: block;">
                Password should be between 4 and 60 characters long.
            </div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="offers">
            <label for="offers">Please do not email me Netflix special offers.</label>
        </div>

        <button type="submit" class="btn-submit">CONTINUE</button>
    </form>

    <script>
        const passwordInput = document.getElementById('password');
        const passwordError = document.getElementById('passwordError');

        // Real-time validation for the password field
        passwordInput.addEventListener('input', function() {
            const val = passwordInput.value;
            if (val.length >= 4 && val.length <= 60) {
                passwordInput.classList.remove('invalid');
                passwordInput.classList.add('valid');
                passwordError.style.display = 'none';
            } else {
                passwordInput.classList.remove('valid');
                passwordInput.classList.add('invalid');
                passwordError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
