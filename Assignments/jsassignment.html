<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        h1 {
            font-family: 'Times New Roman', serif;
        }
        .form-group {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
        .form-group label {
            width: 90px;
            text-align: right;
            padding-right: 10px;
        }
        .error-hint {
            color: #cc0000;
            margin-left: 8px;
            font-size: 14px;
        }
        input[type="text"], input[type="password"], select, textarea {
            border: 1px solid #7f9db9;
            padding: 2px 4px;
        }
        textarea {
            width: 350px;
            height: 150px;
        }
        .submit-btn {
            margin-left: 150px;
            margin-top: 15px;
            padding: 3px 12px;
        }
    </style>
</head>
<body>

    <h1>Registration Form</h1>

    <form id="regForm" onsubmit="return validateForm()">
        <div class="form-group">
            <label>User id:</label>
            <input type="text" id="userid" size="20">
            <span class="error-hint" id="useridErr">Required and must be of length 5 to 12.</span>
        </div>

        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" size="20">
            <span class="error-hint" id="passErr">Required and must be of length 7 to 12.</span>
        </div>

        <div class="form-group">
            <label>Name:</label>
            <input type="text" id="name" size="30">
            <span class="error-hint" id="nameErr">Required and alphabates only.</span>
        </div>

        <div class="form-group">
            <label>Address:</label>
            <input type="text" id="address" size="30">
            <span class="error-hint" style="color: #cc0000;">Optional.</span>
        </div>

        <div class="form-group">
            <label>Country:</label>
            <select id="country">
                <option value="">(Please select a country)</option>
                <option value="US">United States</option>
                <option value="IN">India</option>
                <option value="UK">United Kingdom</option>
            </select>
            <span class="error-hint" id="countryErr">Required. Must select a country.</span>
        </div>

        <div class="form-group">
            <label>ZIP Code:</label>
            <input type="text" id="zip" size="20">
            <span class="error-hint" id="zipErr">Required. Must be numeric only.</span>
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="text" id="email" size="30">
            <span class="error-hint" id="emailErr">Required. Must be a valid email.</span>
        </div>

        <div class="form-group">
            <label>Sex:</label>
            <input type="radio" name="sex" value="Male"> Male
            <input type="radio" name="sex" value="Female"> Female
            <span class="error-hint" id="sexErr">Required.</span>
        </div>

        <div class="form-group">
            <label>Language:</label>
            <input type="checkbox" name="lang" value="English" checked> English
            <input type="checkbox" name="lang" value="Non English"> Non English
            <span class="error-hint" id="langErr">Required.</span>
        </div>

        <div class="form-group" style="align-items: flex-start;">
            <label>About:</label>
            <textarea id="about"></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit</button>
    </form>

    <script>
        function validateForm() {
            let isValid = true;

            const uid = document.getElementById('userid').value;
            if (uid.length < 5 || uid.length > 12) isValid = false;

            const pass = document.getElementById('password').value;
            if (pass.length < 7 || pass.length > 12) isValid = false;

            const name = document.getElementById('name').value;
            if (!/^[A-Za-z]+$/.test(name)) isValid = false;

            const country = document.getElementById('country').value;
            if (country === "") isValid = false;

            const zip = document.getElementById('zip').value;
            if (!/^\d+$/.test(zip)) isValid = false;

            const email = document.getElementById('email').value;
            if (!/^\S+@\S+\.\S+$/.test(email)) isValid = false;

            const sex = document.querySelector('input[name="sex"]:checked');
            if (!sex) isValid = false;

            if (!isValid) {
                alert("Please correct the errors before submitting.");
                return false;
            }

            alert("Form submitted successfully!");
            return true;
        }
    </script>
</body>
</html>
