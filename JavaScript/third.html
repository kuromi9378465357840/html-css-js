<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello world</title>
</head>
<body>
    <h1>javascript program</h1>
    <script>
        // display hellow world on the wbepage
        document.write("Hello world" + "<br><br>");
        let num1= 20;
        let num2= 10;
        // perform addition
        let addition= num1+num2;
        // perform subtraction
        let subtraction= num1-num2;
        // perform multiplication
        let multiplication= num1*num2;
        // perform division
        let division= num1/num2;
        // display the results
        document.write("First number = " + num1 + "<br>");
        //  + concantenate operator is used to join text and values.
        document.write("Second number = " + num2 + "<br><br>");
        document.write("Addition = "+ addition + "<br>");
        document.write("Subtraction = "+ subtraction + "<br>");
        document.write("Multiplication = "+ multiplication + "<br>");
        document.write("Division = "+ division + "<br>");
    </script>
    
</body>
</html>
