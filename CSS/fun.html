<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>CURSOR ANIMATION</title>
        <style>
            body { margin: 0; background: #faf8f8; overflow: hidden;}
            svg {width: 100vw; height: 100vh;}
        </style>
    </head>
    <body>
        <svg id="canvas">
            <defs>
                <g id="shape">
                    <path d="M 0, -10 C 15, -20 20, 0 0,20 C -20,0 -15, -20 0,-10" fill="black" stroke-width="1.5"/>
                    <circle cx="0" cy="0" r="4" fill="red"/>
                </g>
            </defs>
        </svg>
        <script>
            const svg = document.getElementById('canvas');
            const N = 40;
            const width = window.innerWidth;
            const height = window.innerHeight;
            const rad = 100;
            let frm = 0;

            const pointer = { x: width / 2, y: height / 2 };
            window.addEventListener('pointermove', (e) => {  
                pointer.x = e.clientX;
                pointer.y = e.clientY;
            });

            const elems = [];
            for (let i = 0; i < N; i++) {
                const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
                use.setAttribute('href','#shape');
                svg.appendChild(use);
                elems.push({ use, x: width / 2, y: height / 2 });
            }
            const run = () => {
                requestAnimationFrame(run);
                frm += 0.01;
                let e = elems[0];
                const ax = (Math.cos(3*frm)*rad*width)/height;
                const ay = (Math.sin(4*frm)*rad*width)/width;
                e.x += (ax + pointer.x - e.x)/10;
                e.y += (ay + pointer.y - e.y)/10;
                for (let i = 1; i<N; i++){
                    let e = elems[i];
                    let ep = i===0? pointer: elems[i-1];
                    const a = Math.atan2(e.y -ep.y, e.x -ep.x);
                    e.x += (ep.x -e.x + (Math.cos(a)* (100-i))/5)/4;
                    e.y += (ep.y - e.y +(Math.sin(a)*(100-i))/5)/4;
                    const s =(162 -4 *(1-i))/250;
                    e.use.setAttributeNS(
                        null,
                        'transform',
                        `translate(${(ep.x + e.x)/2},${(ep.y+e.y)/2}) rotate(${(180/Math.PI)*a}) scale(${s})`
                    );
                }
            };
            run();
        </script>
    </body>
    </html>
