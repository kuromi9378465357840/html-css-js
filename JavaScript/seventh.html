<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swap1</title>
</head>
<body>
    <script>
    let num = 123456789;
    let num1 = 347;

    let temp = num;
    num = num1;
    num1 = temp;

    document.write("After swapping: num = " + num + ", num1 = " + num1);
    </script>
</body>
</html>
