<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>count digits</title>
</head>
<body>
    <script>
        let num = 12345;
        let count = 0;
        while(num>0){
            num = Math.floor(num/10);
            count++;
        }
        document.write("Number of digits: " + count);
    </script>
</body>
</html>
