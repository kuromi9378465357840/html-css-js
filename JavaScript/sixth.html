<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reverse of a number</title>
</head>
<body>
    <h1> reverse a number</h1>
    <script>
        let num = 123456789;
        let originalNumber = num;
        let reverse = 0;

        while(num>0){
            // get the last digit
            let digit = num % 10;
            //  add digit to reverse
            reverse = reverse * 10 + digit;
            // remove the last digit
            num = Math.floor(num/10);
        }
        document.write("Original number: " + originalNumber + "<br>");
        document.write("Reversed number: " + reverse);
    </script>
</body>
</html>
