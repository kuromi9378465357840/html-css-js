<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Temperature Table</title>
    <style>
        
        table {
            border-collapse: collapse;
            width: 600px;
            font-family: serif;
            text-align: center;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            font-size: 18px;
        }

        
        th {
            background-color: lightpink; 
        }

        
        td {
            background-color: azure;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>Place</th>
            <th>State</th>
            <th>Maximum Temperature in C</th>
        </tr>
        <tr>
            <td>Wardha</td>
            <td rowspan="2">Maharashtra</td>
            <td>47.5</td>
        </tr>
        <tr>
            <td>Akola</td>
            <td>46.4</td>
        </tr>
        <tr>
            <td>Khajuraho</td>
            <td rowspan="2">Madhya Pradesh</td>
            <td>46.4</td>
        </tr>
        <tr>
            <td>Sagar</td>
            <td>46.2</td>
        </tr>
    </table>

</body>
</html>
