<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
    <title>QUESTION</title>
    <style>
        body {
            background-color: #f5f5f5;
            margin: 20 px;
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            text-align: center;
            color: brown;
            background-color: burlywood
        }
        /* sticky heading */
        h2 {
            background-color: cadetblue;
            color: azure;
            padding: 50px;
            position: sticky;
            top: 0;
        }
        /* common notice board */
        p {
            width: 400px;
            padding: 20px;
            border: 2px solid gray;
            margin: 20px;
        }
        /* relative parent */
        .notice1 {
            position: relative;
        }
        /* absolute child */
        .notive2{
            position: absolute;
            top: 5px;
            right: 10px;
            background-color: darkcyan;
            color: beige;
            padding: 5px;
            border: 1px solid darkred;
        }
        /* static example */
        .notice2{
            position: static;
        }
        /* fixed button */
        button{
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px;
            background-color: green;
            color: pink;
            border: none;
        }
        /* extra content for scrolling */
        .extra{
            width: 400px;
            padding: 20 px;
        }
        

    </style>
    </head>
    <body>
        <h1>Important Notice</h1>
        <h2>HOLYYYYYYYSHITTTTTTTTTTTT</h2>
    </body>
</html>
